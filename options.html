  <style>
    /* ═══════════════════════════════════════════════════════════════════════
       AI Write — three directions (iOS prototype)

       A walkthrough, not a contact sheet: one live screen at a time, with
       Prev / Next, clickable dots and arrow keys. The screen itself is live,
       so taps inside the phone drive the flow and the step counter follows.

       Option 1 — Smart Write from blank. A short sheet docks on top of the
         keyboard (Gmail's shape, Figma 6630:224469) in Titan's language:
         title "Smart Write by Titan AI", cycling examples from Titan's own
         "See examples" (6633:256878), tone/length from "Writing style"
         (6633:256813) but inline rather than a second page.

       Option 2 — Refine inline. For text already written. The 52px accessory
         bar swaps its own contents per state; nothing new appears on screen.

       Order is driven by FLOWS below; each flow carries a stable `key`, so
       the behavioural branches never depend on the numbering.

       Both render into the 402×874 composer built in index.html.
       ═══════════════════════════════════════════════════════════════════════ */

    /* ═══════════════════════════════════════════════════════════════════════
       AI Refine — lightweight inline flow (iOS, rough draft)

       Problem this answers: today Refine pushes a full-screen "Smart Write by
       Titan AI" takeover (Figma 6633:256634 / 256668 / 256781) — the draft
       disappears, the keyboard drops, and the user is somewhere else.

       Competitor read (Figma 6630:220185):
         · Superhuman keeps everything anchored to the selection — a compact
           popover, then a shallow dock to accept. Composer never leaves.
         · Outlook is closer to ours: a tall sheet with a long menu.

       This draft goes one step lighter than Superhuman: there is no popover
       and no dock either. The 52px accessory bar that already sits above the
       keyboard (y=486, from index.html) IS the entire surface. It swaps its
       contents per state, so the draft never moves and the keyboard never
       drops. Frame stays 402×874 — same geometry as the built screens.
       ═══════════════════════════════════════════════════════════════════════ */

    /* ══════════════════════════════════════════════════════════════════════
       AI Write — mobile entry points (iOS + Android)

       Source: Figma "Titan AI Write" → page "AI Write - Mobile" → section
       "Latest". Four frames, built 1:1 against the Figma node geometry:

         ios / Mail          6633:259073   402 × 874   no selection
         ios / Mail          6633:259130   402 × 874   text selected
         android / 4         6633:259184   412 × 917   no selection
         android / 7         6633:259248   412 × 917   text selected

       Every frame, row, pill and chip keeps the width/height/offset Figma
       reports — nothing is re-flowed to fit. The composer toolbars overflow
       their frames exactly as they do in the design (iOS row is 893px wide
       inside a 402px frame; Android chip row is 901px inside 412px), so the
       4th item clips at the right edge the way the source shows it.

       The entry point itself is the bottom accessory bar above the keyboard:
         · nothing selected → "AI Write"
         · text selected    → the bar collapses to "AI Refine"

       Icons are the Titan DS "Compose tools" set, inlined from
       design-system/icons/assets so the file stands alone.
       ══════════════════════════════════════════════════════════════════════ */

    /* ── bottom accessory bar: the AI Write / AI Refine entry point ────── */

    /* ── iOS compact (edit) menu ───────────────────────────────────────── */
    .ios-menu {
      position: absolute;
      left: 35px;
      top: 235px;
      height: 40px;
      display: flex;
      align-items: stretch;
      background: var(--ios-menu);

    /* ══════════════ refine flow — additions on top of the built screens ══ */

    /* the accessory bar is the only surface this flow ever uses: it swaps its
       contents instead of pushing a sheet, so the composer never moves */
    .bar-scroll {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
    }

    .back-chip {
      flex: none;
      width: 30px;
      height: 36px;
      border: 1px solid var(--stroke);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      background: #fff;
    }

    .ios-pill.ai {
      border-color: #c9d8fb;
      background: linear-gradient(180deg, #f7faff, #f2f6fe);
      color: #1b57c4;
    }

    .ios-pill.primary {
      border-color: var(--titan-blue);
      background: var(--titan-blue);
      color: #fff;
    }

    .ios-pill.quiet {
      color: #666;
    }

    .ios-pill[data-act] {
      cursor: pointer;
    }

    /* selection highlight, inline so it tracks whatever the copy becomes */
    .selhl {
      background: var(--ios-select);
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    /* text the model just produced, still pending accept */
    .ai-new {
      display: block;
      background: linear-gradient(90deg, #eef3ff, #f6f0ff);
      border-left: 2px solid #6f8ff5;
      border-radius: 0 4px 4px 0;
      padding: 2px 6px 2px 8px;
      margin: 2px 0;
    }

    /* in-place "thinking": the selection breathes, nothing overlays it */
    .shimmer {
      position: relative;
      overflow: hidden;
    }

    .shimmer::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, transparent 20%, rgba(255, 255, 255, .85) 50%, transparent 80%);
      animation: sweep 1.25s linear infinite;
    }

    @keyframes sweep {
      from {
        transform: translateX(-100%);
      }

      to {
        transform: translateX(100%);
      }
    }

    /* span only — the stepper's own .dots row is a div and must not animate */
    span.dots::after {
      content: '';
      animation: dots 1.2s steps(4, end) infinite;
    }

    @keyframes dots {
      0% {
        content: '';
      }

      25% {
        content: '.';
      }

      50% {
        content: '..';
      }

      75% {
        content: '...';
      }
    }

    /* custom-prompt state: a field in the bar, not a sheet */

      flex: 1 1 auto;
      height: 36px;
      border: 1px solid #c9d8fb;

      background: var(--titan-blue);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 6px;
      box-sizing: border-box;
    }

      gap: 40px;

    }

    .note b {

      /* ══════════════ option 2 — Smart Write from a blank draft ══════════ */

    /* a short sheet docked to the top of the keyboard. It never covers the
       composer header or the recipient rows, and it never becomes a page. */
    .sw {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 336px;
      /* sits exactly on top of the keyboard */
      background: #fff;
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -1px 0 0 #ebebeb, 0 -12px 28px -12px rgba(0, 0, 0, .16);
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sw-head {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 24px;
    }

    .sw-head .icon {
      width: 20px;
      height: 20px;
      flex: none;
      color: #2170f4;
    }

    .sw-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--font-primary);
      flex: 1 1 auto;
    }

    .sw-x {
      width: 20px;
      height: 20px;
      color: #888;
      flex: none;
    }

    /* prompt field — focused ring in Titan blue */
    .sw-field {
      border: 1.5px solid var(--titan-blue);
      border-radius: 10px;
      padding: 10px 12px;
      min-height: 72px;
      font-size: 15px;
      line-height: 1.45;
      color: var(--font-primary);
      position: relative;
      overflow: hidden;
    }

    .sw-field.idle {
      border-color: #dfdfdf;
    }

    /* the cycling example — one line in, one line out */
    .sw-ex {
      color: #9aa0a6;
      /* opacity 1 is the resting state — the keyframe only adds an entrance,
         so the example can never be left invisible if the anim is interrupted */
      animation: exIn .4s ease;
    }

    @keyframes exIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .sw-caret {
      display: inline-block;
      width: 1.5px;
      height: 17px;
      background: var(--titan-blue);
      vertical-align: -3px;
      animation: blink 1.1s steps(2, end) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .sw-foot {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sw-style {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 32px;
      min-height: 32px;
      padding: 6px 8px;
      font-size: 14px;
      color: var(--titan-blue);
      cursor: pointer;
      box-sizing: border-box;
    }

    .sw-style .icon {
      width: 18px;
      height: 18px;
    }

    button,
    [data-act] {
      font: inherit;
    }

    .sw-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 32px;
      min-height: 32px;
      margin-left: auto;
      background: var(--titan-blue);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      line-height: 20px;
      padding: 8px 18px;
      border-radius: 226px;
      cursor: pointer;
      box-sizing: border-box;
      border: 0;
    }

    .sw-btn.off {
      background: #ececec;
      color: #a8a8a8;
      cursor: default;
    }

    .sw-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--stroke);
      background: #fff;
      color: #333;
      cursor: pointer;
      flex: none;
    }

    .sw-icon-btn .icon {
      width: 18px;
      height: 18px;
      flex: none;
    }

    /* unsized icons inside a button stretch to fill it — pin them */
    .sw-btn .icon {
      width: 16px;
      height: 16px;
      flex: none;
    }

    /* a row of buttons that starts at the left instead of pushing right */
    .sw-foot.left .sw-btn {
      margin-left: 0;
    }

    .sw-btn.ghost {
      background: #fff;
      color: var(--font-primary);
      border: 1px solid var(--stroke);
      font-weight: 500;
      margin-left: 0;
    }

    /* tone / length, tucked behind one tap so the sheet stays small */
    .sw-opts {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sw-optrow {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sw-optlbl {
      font-size: 12px;
      color: #888;
      width: 48px;
      flex: none;
    }

    .sw-chip {
      min-width: 32px;
      min-height: 32px;
      height: 32px;
      border: 1px solid var(--stroke);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      color: #555;
      cursor: pointer;
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .sw-chip.on {
      border-color: var(--titan-blue);
      background: #eef4ff;
      color: #1b57c4;
    }

    /* generating — Titan's gradient bars, drawn in the draft itself */
    .gen {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .gen i {
      display: block;
      height: 11px;
      border-radius: 6px;
      background: linear-gradient(90deg, #b9c9f7, #d9c2ef);
      animation: pulse 1.3s ease-in-out infinite;
    }

    .gen i:nth-child(2) {
      animation-delay: .12s;
    }

    .gen i:nth-child(3) {
      animation-delay: .24s;
    }

    .gen i:nth-child(4) {
      animation-delay: .36s;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: .45;
      }

      50% {
        opacity: 1;
      }
    }

    .sw-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #666;
    }

    .draft-new {
      background: linear-gradient(90deg, #eef3ff, #f6f0ff);
      border-left: 2px solid #6f8ff5;
      border-radius: 0 4px 4px 0;
      padding: 2px 6px 2px 8px;
      display: block;
    }

    /* ══════════════ option switcher — fixed, bottom left ══════════════ */
    .switcher {
      position: fixed;
      left: 24px;
      bottom: 24px;
      z-index: 50;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 30px -8px rgba(0, 0, 0, .25), 0 0 0 1px rgba(0, 0, 0, .06);
      padding: 8px;
      width: 268px;
    }

    .switcher h4 {
      margin: 4px 8px 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: #999;
    }

    .opt {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      width: 100%;
      min-width: 32px;
      min-height: 32px;
      text-align: left;
      border: 0;
      background: none;
      font: inherit;
      padding: 9px 10px;
      border-radius: 10px;
      cursor: pointer;
      color: #333;
      box-sizing: border-box;
    }

    .opt:hover {
      background: #f4f6f9;
    }

    button:focus-visible,
    [data-act]:focus-visible,
    .opt:focus-visible,
    .nav button:focus-visible {
      outline: 3px solid rgba(33, 112, 244, 0.35);
      outline-offset: 2px;
    }

    .opt.on {
      background: #eef4ff;
    }

    .opt .n {
      flex: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #e8e8e8;
      color: #777;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }

    .opt.on .n {
      background: var(--titan-blue);
      color: #fff;
    }

    .opt b {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
    }

    .opt span {
      display: block;
      font-size: 12px;
      color: #777;
      line-height: 1.4;
      margin-top: 1px;
    }

    .opt.on b {
      color: #1b57c4;
    }


    /* ══════════════ stepper prototype — one screen at a time ═══════════ */

    /* Catch-all: an inline <svg> with no width/height attribute has no
       intrinsic size and will balloon to fill its parent. Every icon inside
       the sheet gets a size here; specific rules below refine it. */
    .sw .icon,
    .sw-status .icon {
      width: 18px;
      height: 18px;
      flex: none;
    }

    .stage {
      max-width: 520px;
    }

    .stage-head {
      min-height: 92px;
      margin-bottom: 18px;
    }

    .step-count {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: #9a9a9a;
    }

    .step-title {
      margin: 6px 0 4px;
      font-size: 19px;
      font-weight: 600;
      color: #222;
    }

    .step-desc {
      margin: 0;
      font-size: 14px;
      line-height: 1.55;
      color: #666;
      max-width: 46ch;
    }

    .stage-frame {
      width: 402px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 50px -18px rgba(0, 0, 0, .35), 0 0 0 1px rgba(0, 0, 0, .07);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 402px;
      margin-top: 20px;
    }

    .nav button {
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      color: #333;
      background: #fff;
      border: 1px solid var(--stroke);
      border-radius: 999px;
      padding: 9px 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav button:hover:not(:disabled) {
      border-color: #bbb;
    }

    .nav button:disabled {
      opacity: .4;
      cursor: default;
    }

    .nav button.go {
      margin-left: auto;
      background: var(--titan-blue);
      border-color: var(--titan-blue);
      color: #fff;
    }

    .dots {
      display: flex;
      gap: 6px;
    }

    .dots i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #cfcfcf;
      cursor: pointer;
      transition: background .15s, transform .15s;
    }

    .dots i.on {
      background: var(--titan-blue);
      transform: scale(1.25);
    }

    .stage-hint {
      margin: 14px 0 0;
      font-size: 13px;
      line-height: 1.5;
      color: #888;
      width: 402px;
    }

    .stage-hint kbd {
      font: inherit;
      font-size: 11px;
      border: 1px solid #ddd;
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 1px 5px;
      background: #fafafa;
      color: #555;
    }

    /* ══════════════ option 1 — draft review inside the sheet ═══════════ */

    /* Once Create is tapped the keyboard drops and the sheet grows to a
       reading height. The draft stays in here until the user approves it —
       nothing touches the composer before Insert. */
    .scrim {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .22);
    }

    .sw.full {
      bottom: 0;
      height: 650px;
      padding-bottom: 40px;
    }

    /* describing a change: the keyboard comes back and the sheet rides on
       it, shorter, with the draft still scrollable above the field */
    .sw.full.kb {
      bottom: 336px;
      height: 430px;
      padding-bottom: 12px;
    }

    .sw-field.ask {
      flex: none;
      min-height: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 6px 6px 12px;
      cursor: text;
    }

    .sw-field.ask .txt {
      flex: 1 1 auto;
    }

    .sw-field.ask .ph {
      color: #9aa0a6;
    }

    .sw-field.ask .bar-send {
      margin-left: 0;
    }

    .sw-field.ask .bar-send.off {
      background: #dfe6f5;
    }

    .sw-style .val {
      color: #666;
    }

    /* ══════════════ ways out — every open thing can be closed ══════════ */

    .flip {
      transform: rotate(180deg);
    }

    /* tap-outside target: sits over the composer, under whatever is open */
    .catch {
      position: absolute;
      inset: 0;
      cursor: pointer;
    }

    .scrim[data-act] {
      cursor: pointer;
    }

    .scrim.top {
      z-index: 9;
    }

    .sw-subj {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
    }

    /* version stepper — a rewrite never overwrites what the user read */
    .sw-ver {
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: 12px;
      font-weight: 500;
      color: #666;
      white-space: nowrap;
    }

    .sw-ver .a {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      color: #333;
      cursor: pointer;
    }

    .sw-ver .a.off {
      color: #ccc;
      cursor: default;
    }

    .sw .sw-ver .icon {
      width: 14px;
      height: 14px;
    }

    .ask-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: none;
    }

    .ask-row .sw-field {
      flex: 1 1 auto;
    }

    .sw-cancel {
      flex: none;
      font-size: 15px;
      color: var(--titan-blue);
      cursor: pointer;
    }

    /* iOS action sheet for leaving with an un-inserted draft */
    .confirm {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 30px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: exIn .25s ease;
    }

    .confirm .grp {
      background: rgba(249, 249, 249, .98);
      border-radius: 14px;
      overflow: hidden;
      text-align: center;
    }

    .confirm .t {
      padding: 14px 18px 12px;
      font-size: 13px;
      line-height: 1.35;
      color: #8a8a8e;
    }

    .confirm .t b {
      display: block;
      font-weight: 600;
      color: #555;
      margin-bottom: 2px;
    }

    .confirm .b {
      padding: 16px;
      font-size: 18px;
      color: var(--titan-blue);
      border-top: .5px solid rgba(60, 60, 67, .29);
      cursor: pointer;
    }

    .confirm .b.red {
      color: #e5382f;
    }

    .confirm .grp > .b:first-child {
      border-top: 0;
      font-weight: 600;
    }

    /* undo window after anything that changes the email */
    .toast {
      position: absolute;
      left: 16px;
      right: 16px;
      top: 424px;
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #2b2b2e;
      color: #fff;
      font-size: 14px;
      box-shadow: 0 10px 24px -10px rgba(0, 0, 0, .45);
      animation: exIn .3s ease;
    }

    .toast .icon {
      width: 18px;
      height: 18px;
      color: #7fd18b;
    }

    .toast b {
      margin-left: auto;
      font-weight: 600;
      color: #8fb4ff;
      cursor: pointer;
    }

    .cx-ib.on {
      color: var(--titan-blue);
      background: #eef4ff;
    }

    .sw-grab {
      width: 36px;
      height: 5px;
      border-radius: 3px;
      background: #d6d6d6;
      margin: -6px auto -2px;
      flex: none;
    }

    .sw-draft {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      border: 1px solid #e6eaf5;
      border-radius: 12px;
      padding: 12px 14px 28px;
      font-size: 15px;
      line-height: 1.55;
      color: var(--font-primary);
      background: linear-gradient(180deg, #f8faff, #fff 120px);
      -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 36px), transparent);
      mask-image: linear-gradient(180deg, #000 calc(100% - 36px), transparent);
    }

    .sw-subj {
      font-weight: 600;
      padding-bottom: 8px;
      margin-bottom: 10px;
      border-bottom: 1px solid #ebebeb;
    }

    .sw-subj > div > span {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #999;
    }

    .sw-draft .gen {
      padding-top: 4px;
    }

    .sw-foot.fill .sw-btn {
      flex: 1 1 0;
      justify-content: center;
      margin-left: 0;
      padding: 10px 12px;
    }

    .sw.full .home-ind {
      bottom: 8px;
    }

    /* ══════════════ option 2 — chat with AI (web parity) ═══════════════ */

    /* One dock holds the whole conversation with the model. With the
       keyboard up it rides on top of it; once a draft lands the keyboard
       drops and the dock settles at the bottom so the draft can be read. */
    .cx {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: #fff;
      box-shadow: 0 -1px 0 0 #ebebeb, 0 -12px 24px -16px rgba(0, 0, 0, .2);
      padding: 10px 12px 40px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cx.kb {
      bottom: 336px;
      padding-bottom: 8px;
      box-shadow: 0 -1px 0 0 #ebebeb;
    }

    .cx-field {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      border: 1px solid #c9d8fb;
      border-radius: 12px;
      padding: 6px 6px 6px 12px;
      background: #fbfcff;
      font-size: 15px;
      line-height: 1.4;
      min-height: 42px;
      cursor: text;
    }

    .cx-field.focus {
      border-color: var(--titan-blue);
      background: #fff;
    }

    .cx-field > .icon {
      width: 18px;
      height: 18px;
      flex: none;
      color: var(--titan-blue);
      align-self: center;
    }

    .cx-text {
      flex: 1 1 auto;
      min-width: 0;
      align-self: center;
      padding: 3px 0;
    }

    .cx-text.ph {
      color: #9aa0a6;
    }

    .cx-count {
      font-size: 12px;
      color: #999;
      white-space: nowrap;
      align-self: center;
    }

    .cx-send {
      flex: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--titan-blue);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .cx-send.off {
      background: #dfe6f5;
      cursor: default;
    }

    .cx-send .icon {
      width: 18px;
      height: 18px;
    }

    .cx-x {
      flex: none;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      cursor: pointer;
      align-self: center;
    }

    .cx-x .icon {
      width: 14px;
      height: 14px;
    }

    .cx-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cx-chip {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 32px;
      min-height: 32px;
      height: 32px;
      padding: 6px 10px 6px 11px;
      border: 1px solid var(--stroke);
      border-radius: 999px;
      font-size: 13px;
      color: #333;
      background: #fff;
      cursor: pointer;
      box-sizing: border-box;
    }

    .cx-modal {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px 12px 10px;
      background: #fff;
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -1px 0 0 #ebebeb, 0 -12px 28px -12px rgba(0, 0, 0, .16);
    }

    .cx-modal-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 600;
      color: var(--font-primary);
    }

    .cx-modal-head .icon {
      width: 18px;
      height: 18px;
      color: var(--titan-blue);
      flex: none;
    }

    .cx-modal-draft {
      border: 1px solid #edf0f3;
      border-radius: 12px;
      background: #fafbff;
      padding: 12px 14px;
      font-size: 15px;
      line-height: 1.55;
      color: #2b2f36;
      min-height: 150px;
    }

    .cx-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 2px;
    }

    .cx-action {
      min-width: 32px;
      min-height: 32px;
      height: 32px;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid var(--stroke);
      cursor: pointer;
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .cx-action.ghost {
      background: #fff;
      color: var(--font-primary);
      border-color: var(--stroke);
    }

    .cx-action.primary {
      background: var(--titan-blue);
      color: #fff;
      border-color: var(--titan-blue);
    }

    .cx-chip.open {
      border-color: var(--titan-blue);
      color: #1b57c4;
    }

    .cx-chip > .icon {
      width: 16px;
      height: 16px;
      color: #888;
    }

    .cx-ib {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      border-radius: 8px;
      cursor: pointer;
    }

    .cx-ib.off {
      color: #cdcdcd;
      cursor: default;
    }

    .cx-ib .icon {
      width: 20px;
      height: 20px;
    }

    .cx-sep {
      width: 1px;
      height: 20px;
      background: #e3e3e3;
      margin: 0 2px;
    }

    .cx-push {
      margin-left: auto;
    }

    .cx-meta {
      font-size: 12px;
      color: #999;
      padding: 0 2px;
    }

    /* 5 or fewer left: the counter turns into the upgrade banner (web logic) */
    .cx-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fdf1d8;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12.5px;
      line-height: 1.35;
      color: #555;
    }

    .cx-banner b {
      font-weight: 500;
      color: var(--titan-blue);
    }

    .cx-banner .up {
      flex: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #f2a93b;
      color: #3a2a00;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cx-banner .up .icon {
      width: 12px;
      height: 12px;
    }

    .cx-spin {
      flex: none;
      width: 16px;
      height: 16px;
      border: 2px solid #c9d8fb;
      border-top-color: var(--titan-blue);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      align-self: center;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .cx-menu {
      position: absolute;
      left: -1px;
      bottom: calc(100% + 8px);
      z-index: 5;
      min-width: 176px;
      background: #fff;
      border-radius: 12px;
      padding: 4px;
      box-shadow: 0 12px 32px -8px rgba(0, 0, 0, .3), 0 0 0 1px rgba(0, 0, 0, .06);
      cursor: default;
    }

    .cx-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 2px 2px 10px;
      border-bottom: 1px solid rgba(0, 0, 0, .6);
      color: #1b1b1b;
    }

    .cx-modal-header .cx-title {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1 1 auto;
      font-size: 32px;
      line-height: 1.15;
      font-weight: 400;
    }

    .cx-modal-header .cx-title .icon {
      width: 22px;
      height: 22px;
      color: var(--titan-blue);
      flex: none;
    }

    .cx-modal-close {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      cursor: pointer;
      flex: none;
    }

    .cx-modal-close .icon {
      width: 20px;
      height: 20px;
    }

    .cx-modal-top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: none;
    }


    .cx-menu div {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      color: #333;
      cursor: pointer;
    }

    .cx-menu div:hover {
      background: #f4f6f9;
    }

    .cx-menu div.on {
      color: #1b57c4;
      font-weight: 600;
    }

    .cx-menu .icon {
      width: 16px;
      height: 16px;
    }

  </style>
</head>

<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

        (parts.sheet || '') +

        (parts.kbd === false ? '' : KBD) + (parts.over || '') + '</div>';

    function toast(msg, act) {
      return '<div class="toast">' + ico('i-check') + msg + '<b data-act="' + act + '">Undo</b></div>';
    }

    /* ══════════════ OPTION 1 — refine inline, bar becomes the menu ═════ */
    var ORIG = 'I hope this email finds you well. I am writing to provide a quick update on our ongoing campaign and outline what our team will focus on over the coming week.';
    var NEW = "Here's a quick update on our campaign and what the team is focused on this week.";

    function o1body(s) {

      return '<p>Hi Jim,<br><br><span class="selhl' + (s === 'working' ? ' shimmer' : '') + '">' + ORIG + '</span></p>';
    }

    function o1bar(s) {
      var back = '<div class="back-chip" data-act="back">' + ico('i-chev-left') + '</div>';

        case 'select': return pill('i-ai-write', 'AI Refine', { cls: 'ai', act: 'open' });

          pill('i-grammar', 'Fix grammar', { act: 'run' }) + pill('i-tone', 'Tone', { act: 'tone', trail: ' ›' }) +
          pill('i-kbd-hide', 'Custom', { act: 'custom' });
        case 'tone': return back + pill('', 'Friendly', { act: 'run' }) + pill('', 'Formal', { act: 'run' }) +
          pill('', 'Direct', { act: 'run' }) + pill('', 'Warm', { act: 'run' }) + pill('', 'Confident', { act: 'run' });
        case 'working': return pill('i-ai-write', '<span>Shortening</span><span class="dots"></span>', { cls: 'ai' }) +
          pill('i-stop', 'Stop', { cls: 'quiet', act: 'back' });
        case 'result': return pill('i-check', 'Keep', { cls: 'primary', act: 'keep' }) +
          pill('i-retry', 'Try again', { act: 'run' }) + pill('i-close', 'Revert', { act: 'revert' }) +
          pill('i-more-vertical', '', { cls: 'quiet', act: 'open' });

          '<span class="bar-send" data-act="run">' + ico('i-send-up') + '</span></div>';
        case 'kept': return pill('i-attachment', 'Attach') + pill('i-ai-write', 'AI Write') +

          '<span>Replace…</span><span style="padding:0 11px">&#8250;</span><div class="ios-menu-tail"></div></div>' : '',

        var open = menu === key;
        return '<span class="cx-chip' + (open ? ' open' : '') + '"' + go(open ? 's-draft' : 's-' + key) + '>' + label +
          ico('i-chev-down', open ? 'flip' : '') + (open ? list(opts, key === 'tone' ? sDraft.tone : sDraft.len, key) : '') + '</span>';
      }
      return '<div class="cx-row" style="gap:8px; align-items:center;">' +
        chip('tone', sDraft.tone, TONES) +
        chip('len', sDraft.len, LENS) +
        '<span class="cx-push"></span>' +
        '<span class="cx-ib" data-act="s-draft">' + ico('i-thumb-up') + '</span>' +
        '<span class="cx-ib" data-act="s-draft">' + ico('i-thumb-down') + '</span>' +
        '</div>';
    }

    function o3sheetFrame(s) {
      var draft = '<p>Hi team,<br><br>Just a reminder that we have our design workshop next Saturday from 2:00 PM to 4:00 PM.<br><br>Looking forward to spending the afternoon together, collaborating, sharing ideas, and refining our design approach. If you have any work, inspiration, or questions you would like to discuss, feel free to bring them along.<br><br>See you all next Saturday!</p>';
      var draftSheet = '<div class="sw-head">' + ico('i-ai-write') +
        '<span class="sw-title">Smart Write by Titan AI</span>' +
        '<span class="sw-ver"><span class="a" data-act="s-draft">' + ico('i-chev-left') + '</span>2 / 2<span class="a off" data-act="s-draft">' + ico('i-chev-left', 'flip') + '</span></span>' +
        '<svg class="icon sw-x" data-act="s-blank"><use href="#i-close"/></svg></div>' +
      '<div class="cx-modal-draft">' + draft + '</div>' +
        sTools(s === 's-tone' ? 'tone' : (s === 's-len' ? 'len' : null)) +
        '<div class="cx-row" style="justify-content:space-between; margin-top:6px;">' +
          '<div class="cx-field" style="flex:1; min-width:0;" data-act="s-draft">' +
            '<span class="cx-text ph">Describe your change</span>' +
          '</div>' +
          '<span class="cx-send" data-act="s-done">' + ico('i-send-up') + '</span>' +
        '</div>';
      switch (s) {
        case 's-blank':
          return shell({ subject: '', body: '', bar: COMPOSE_ROW('go:s-open') });
        case 's-open':
          return shell({ subject: '', body: '', bar: null, sheet: dock(
            cField({ text: 'Describe your email', ph: true, focus: true, count: '7 left', tap: 's-typed', close: 's-blank' }), true) });
        case 's-typed':
          return shell({ subject: '', body: '', bar: null, sheet: dock(
            cField({ text: C_PROMPT, focus: true, send: 's-generate', close: 's-blank' }), true) });
        case 's-generate':
          return shell({ subject: '', body: '', bar: null, kbd: false, sheet: dock(
            cField({ text: 'Generating…', ph: true, busy: 's-typed', close: 's-blank' })) });
        case 's-draft':
        case 's-tone':
        case 's-len':
          return shell({
            subject: '', body: '', bar: null, kbd: false, sheet: dock(draftSheet, false)
          });
        case 's-done':
          return shell({ subject: '', body: draft, bar: COMPOSE_ROW('go:s-blank') });
      }
    }

    var VIEW = document.getElementById('view');
    var opt = 2, idx = 0, st2 = { ex: 0, tone: 'Professional', len: 'Short', v: 1, view: 1, rw: false }, sDraft = { tone: 'Professional', len: 'Short' };
    var timer = null, exTimer = null;
    /* a tap can reach a state that isn't its own step (undo, closing from an
       older version); it shows under the step it branched from */
    var detour = null;

    function flow() { return FLOWS[opt]; }
    function stateAt(i) { return detour || flow().steps[i][0]; }

    /* jump the counter to whatever state a tap produced */
    function syncTo(state) {
      var i = flow().steps.findIndex(function (s) { return s[0] === state; });
      if (i >= 0) { idx = i; detour = null; } else detour = state;
      draw();
    }

    function draw() {
      clearTimeout(timer); clearInterval(exTimer);
      var f = flow(), step = f.steps[idx], state = stateAt(idx);

      VIEW.innerHTML =
        '<section class="platform stage">' +
        '<div class="stage-head">' +
        '<div class="step-count">' + f.name + ' &middot; step ' + (idx + 1) + ' of ' + f.steps.length + '</div>' +
        '<h3 class="step-title">' + step[1] + '</h3>' +
        '<p class="step-desc">' + step[2] + '</p></div>' +
        '<div class="stage-frame" id="live">' + f.render(state) + '</div>' +
        '<div class="nav">' +
        '<button id="prev"' + (idx === 0 ? ' disabled' : '') + '>&larr; Prev</button>' +
        '<div class="dots">' + f.steps.map(function (_, i) {
          return '<i class="' + (i === idx ? 'on' : '') + '" data-i="' + i + '"></i>';
        }).join('') + '</div>' +
        '<button class="go" id="next"' + (idx === f.steps.length - 1 ? ' disabled' : '') + '>Next &rarr;</button>' +
        '</div>' +
        '<p class="stage-hint">The screen is live — tap inside it to drive the flow, or step through with ' +
        '<kbd>&larr;</kbd> <kbd>&rarr;</kbd>.</p>' +
        '</section>';

      document.getElementById('prev').onclick = function () { if (idx > 0) { idx--; detour = null; draw(); } };
      document.getElementById('next').onclick = function () { if (idx < f.steps.length - 1) { idx++; detour = null; draw(); } };
      VIEW.querySelectorAll('.dots i').forEach(function (d) {
        d.onclick = function () { idx = +d.dataset.i; detour = null; draw(); };
      });

      /* auto-advance out of the "busy" states, as the real thing would */
      if (state === 'working') timer = setTimeout(function () { syncTo('result'); }, 1500);
      if (state === 'writing') timer = setTimeout(function () {
        if (!st2.rw) return syncTo('draft');
        st2.rw = false; st2.v = 2; st2.view = 2; syncTo('draft-v2');
      }, 1800);
      if (state === 'c-gen') timer = setTimeout(function () { syncTo('c-draft'); }, 1800);
      if (state === 'c-regen') timer = setTimeout(function () { syncTo('c-v2'); }, 1800);
      if (state === 's-typed') timer = setTimeout(function () { syncTo('s-generate'); }, 1200);
      if (state === 's-generate') timer = setTimeout(function () { syncTo('s-draft'); }, 1600);

      /* keep the example prompts switching for as long as one is on screen */
      if (f.key === 'write' && (state === 'prompt' || state === 'style')) {
        exTimer = setInterval(function () {
          var host = VIEW.querySelector('.sw-ex');
          if (!host) return clearInterval(exTimer);
          st2.ex = (st2.ex + 1) % EXAMPLES.length;
          host.textContent = EXAMPLES[st2.ex];
          host.style.animation = 'none'; void host.offsetWidth; host.style.animation = '';
        }, 2400);
      }
    }

    /* taps inside the phone */
    VIEW.addEventListener('click', function (e) {
      if (!e.target.closest('#live')) return;

      if (flow().key === 'write' && e.target.closest('.sw-field')) {
        var cur = stateAt(idx);
        if (cur === 'prompt' || cur === 'style') return syncTo('typed');
      }

      var t = e.target.closest('[data-act]'); if (!t) return;
      var a = t.dataset.act, cur = stateAt(idx);

      if (a.indexOf('go:') === 0) return syncTo(a.slice(3));
      if (a.indexOf('fb:') === 0) { var f = a.slice(3); fb = fb === f ? null : f; return draw(); }

      if (flow().key === 'refine') {
        if (a === 'back') return syncTo((cur === 'tone' || cur === 'working' || cur === 'custom') ? 'actions' : 'select');
        if (O1_ACTS[a]) return syncTo(O1_ACTS[a]);
        return;
      }
      if (flow().key === 'draft-sheet') {
        if (a === 's-open' || a === 's-typed' || a === 's-generate' || a === 's-draft' || a === 's-done') return syncTo(a);
        if (a === 's-tone') return syncTo(cur === 's-tone' ? 's-draft' : 's-tone');
        if (a === 's-len') return syncTo(cur === 's-len' ? 's-draft' : 's-len');
        if (a === 's-redo') return syncTo('s-generate');
        if (a.indexOf('s-tone:') === 0) { sDraft.tone = a.split(':').slice(1).join(':'); return syncTo('s-draft'); }
        if (a.indexOf('s-len:') === 0) { sDraft.len = a.split(':').slice(1).join(':'); return syncTo('s-draft'); }
      }
      if (flow().key === 'combined') {
        if (a === 'c-regen') return syncTo('c-regen');
        if (a === 'c-done') return syncTo('c-done');
        if (a === 'c-open' || a === 'c-typed' || a === 'c-gen' || a === 'c-draft') return syncTo(a);
      }
      if (a.indexOf('restyle:') === 0) {            /* style change after reading → rewrite */
        var q = a.split(':');
        st2[q[1] === 'tone' ? 'tone' : 'len'] = q[2]; st2.rw = true;
        return syncTo('writing');
      }
      if (a === 'rewrite' || a === 'regen') { st2.rw = true; return syncTo('writing'); }
      if (a.indexOf('ver:') === 0) { st2.view = +a.slice(4); return draw(); }
      if (a === 'review') { st2.rw = false; return syncTo(reviewState()); }
      /* × asks first whenever there's an un-inserted draft to lose */
      if (a === 'close') return syncTo(/^draft|^confirm/.test(cur) || st2.rw ? 'confirm' : 'blank');
      if (a === 'blank') { st2.v = 1; st2.view = 1; st2.rw = false; }
      if (a.indexOf(':') > 0) {                     /* tone / length chips */
        var p = a.split(':');
        st2[p[0] === 'tone' ? 'tone' : 'len'] = p[1];
        return draw();
      }
      var MAP = {
        open: 'prompt', close: 'blank', style: 'style', prompt: 'prompt',
        typed: 'typed', create: 'writing', done: 'done', blank: 'blank',
        'restyle-open': 'draft-style', edit: 'draft-edit', confirm: 'confirm'
      };
      if (MAP[a]) syncTo(MAP[a]);
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') document.getElementById('next').click();
      if (e.key === 'ArrowLeft') document.getElementById('prev').click();
      if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.closest && e.target.closest('[data-act]')) {
        e.preventDefault();
        e.target.closest('[data-act]').click();
      }
    });

    document.querySelectorAll('.opt').forEach(function (b) {
      b.onclick = function () {
        opt = +b.dataset.opt; idx = 0; st2.ex = 0; st2.v = 1; st2.view = 1; st2.rw = false; detour = null;
        document.querySelectorAll('.opt').forEach(function (x) { x.classList.toggle('on', x === b); });
        draw();
      };
    });

    draw();

  </script>
</body>

</html>
